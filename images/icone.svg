<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Course sur 3 voies</title>
  <rect width="64" height="64" rx="14" fill="#182235"/>
  <!-- route : deux lignes de séparation -->
  <rect x="11" y="0" width="42" height="64" fill="#2b2b2b"/>
  <g fill="#ffffff" opacity="0.85">
    <rect x="24.5" y="6" width="2.5" height="9" rx="1"/><rect x="24.5" y="25" width="2.5" height="9" rx="1"/><rect x="24.5" y="44" width="2.5" height="9" rx="1"/>
    <rect x="37" y="6" width="2.5" height="9" rx="1"/><rect x="37" y="25" width="2.5" height="9" rx="1"/><rect x="37" y="44" width="2.5" height="9" rx="1"/>
  </g>
  <!-- voiture rouge vue de dessus -->
  <rect x="15" y="29" width="14" height="27" rx="6" fill="#e0201c"/>
  <rect x="17.5" y="35" width="9" height="7" rx="2" fill="#1d2633"/>
  <rect x="17.5" y="46" width="9" height="5" rx="2" fill="#1d2633"/>
  <rect x="20" y="30" width="1.6" height="25" fill="#ffffff" opacity="0.9"/>
  <rect x="23" y="30" width="1.6" height="25" fill="#ffffff" opacity="0.9"/>
