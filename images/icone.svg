  <rect x="35" y="6" width="14" height="27" rx="6" fill="#ffd23f"/>
  <rect x="37.5" y="12" width="9" height="7" rx="2" fill="#1d2633"/>
  <rect x="37.5" y="23" width="9" height="5" rx="2" fill="#1d2633"/>
</svg>
