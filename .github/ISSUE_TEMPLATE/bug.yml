name: 🐞 Bug
description: Quelque chose ne fonctionne pas comme prévu
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème ! Pour une **faille de sécurité**, ne publiez
        rien ici : suivez [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: attendu
    attributes:
      label: Ce que vous attendiez
    validations:
      required: true
  - type: textarea
    id: observe
    attributes:
      label: Ce qui s'est passé
      description: Ajoutez une capture d'écran ou une courte vidéo si possible.
    validations:
      required: true
  - type: textarea
    id: reproduire
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Saisir le nom « Léa »
        2. Choisir la difficulté Difficile
        3. …
    validations:
      required: true
  - type: dropdown
    id: appareil
    attributes:
      label: Type d'appareil
      options: [Ordinateur, Téléphone, Tablette]
    validations:
      required: true
  - type: input
    id: navigateur
    attributes:
      label: Appareil et navigateur
      placeholder: iPhone 13 · Safari 18 / Windows 11 · Chrome 131
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Messages de la console (facultatif)
      description: Ouvrez les outils de développement (F12) → Console, et copiez les erreurs.
      render: text
